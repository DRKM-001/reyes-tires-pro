<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyes Tires Pro · Escondido, CA</title>
  <meta name="description" content="Reyes Tires Pro: quality used and new tires and wheels in Escondido, CA. Call (442) 999-5014 for a quote.">
  <style>
    :root { --blue: #1f4e9c; --red: #d62a2a; --ink: #14233b; --paper: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { text-align: center; padding: 48px 24px; max-width: 720px; }
    .mark { font-weight: 800; font-size: 14px; letter-spacing: .3em; color: var(--red); }
    h1 { font-size: clamp(40px, 9vw, 84px); line-height: 1; margin: 12px 0 8px; font-weight: 900; color: var(--blue); }
    .tag { font-size: clamp(16px, 2.6vw, 20px); margin: 0 0 6px; }
    .slogan { font-style: italic; color: var(--red); font-weight: 700; margin: 0 0 32px; }
    .bar { height: 6px; width: 120px; margin: 0 auto 32px; background: linear-gradient(90deg, var(--blue), var(--red)); border-radius: 3px; }
    .cta { display: inline-block; background: var(--blue); color: #fff; text-decoration: none; font-weight: 800;
           font-size: 22px; padding: 16px 28px; border-radius: 10px; }
    .cta:hover { background: #173b78; }
    .info { margin-top: 36px; line-height: 1.7; font-size: 17px; }
    .info strong { color: var(--blue); }
    .brands { margin-top: 32px; font-size: 13px; letter-spacing: .12em; color: #5a6a85; text-transform: uppercase; }
    footer { margin-top: 40px; font-size: 13px; color: #6b7a93; }
  </style>
</head>
<body>
  <main>
    <div class="mark">RT</div>
    <h1>REYES TIRES PRO</h1>
    <p class="tag">Quality used and new tires &amp; wheels</p>
    <p class="slogan">We perform better.</p>
    <div class="bar"></div>
    <a class="cta" href="tel:+14429995014">Call (442) 999-5014</a>
    <p class="info">
      <strong>Call today for a quote</strong><br>
      260 N Juniper St, Escondido, CA 92025<br>
      Mon–Sat 8am–6pm · Sun 8am–3pm
    </p>
    <p class="brands">Michelin · BFGoodrich · Pirelli · Falken</p>
    <footer>&copy; Reyes Tires Pro</footer>
  </main>
</body>
</html>
